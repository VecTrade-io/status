status-website:
  cname: status.vectrade.io
  logoUrl: https://docs.vectrade.io/logo/light.svg
  favicon: https://docs.vectrade.io/logo/light.svg
  name: VecTrade Status
  theme: dark
  navbar:
    - title: Status
      href: /
    - title: VecTrade
      href: https://vectrade.io
    - title: Docs
      href: https://docs.vectrade.io
    - title: GitHub
      href: https://github.com/VecTrade-io
  js: |
    // Umami analytics
    (function() {
      var s = document.createElement('script');
      s.defer = true;
      s.src = 'https://analytics.vectrade.io/script.js';
      s.dataset.websiteId = '6521caa6-d9f5-4845-ad54-342043e0d502';
      document.head.appendChild(s);
    })();
    // Make logo link to vectrade.io instead of status page root
    document.addEventListener('DOMContentLoaded', function() {
      var logo = document.querySelector('nav a[href="/"]');
      if (logo && logo.querySelector('img')) {
        logo.href = 'https://vectrade.io';
      }
    });
  customFootHtml: |
    <style>
      .vt-footer { background: #0d1117; border-top: 1px solid #30363d; padding: 3rem 1.5rem 2rem; margin-top: 4rem; }
      .vt-footer-inner { max-width: 900px; margin: 0 auto; }
      .vt-footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
      @media (max-width: 768px) { .vt-footer-grid { grid-template-columns: 1fr 1fr; } }
      @media (max-width: 480px) { .vt-footer-grid { grid-template-columns: 1fr; } }
      .vt-footer-brand p { color: #8b949e; font-size: 0.875rem; line-height: 1.6; margin-top: 0.75rem; }
      .vt-footer-col h4 { color: #e6edf3; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.75rem; }
      .vt-footer-col a { display: block; color: #8b949e; font-size: 0.875rem; text-decoration: none; padding: 0.25rem 0; transition: color 0.15s; }
      .vt-footer-col a:hover { color: #58a6ff; }
      .vt-footer-bottom { border-top: 1px solid #30363d; padding-top: 1.5rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
      .vt-footer-bottom p { color: #8b949e; font-size: 0.8rem; margin: 0; }
      .vt-footer-bottom-links { display: flex; gap: 1.25rem; flex-wrap: wrap; }
      .vt-footer-bottom-links a { color: #8b949e; font-size: 0.8rem; text-decoration: none; }
      .vt-footer-bottom-links a:hover { color: #58a6ff; }
      .vt-footer-logo { height: 24px; opacity: 0.8; }
    </style>
    <footer class="vt-footer">
      <div class="vt-footer-inner">
        <div class="vt-footer-grid">
          <div class="vt-footer-brand">
            <img src="https://docs.vectrade.io/logo/light.svg" alt="VecTrade" class="vt-footer-logo" />
            <p>Your intelligent market analysis and virtual trading platform.</p>
          </div>
          <div class="vt-footer-col">
            <h4>General</h4>
            <a href="https://vectrade.io/register">Sign Up</a>
            <a href="https://vectrade.io/about">About</a>
            <a href="https://vectrade.io/blog">Blog</a>
            <a href="https://docs.vectrade.io">Docs</a>
          </div>
          <div class="vt-footer-col">
            <h4>Platform</h4>
            <a href="https://vectrade.io/vtrade">VTrade</a>
            <a href="https://vectrade.io/leaderboard">Leaderboard</a>
            <a href="https://vectrade.io/stocks">Markets</a>
            <a href="https://vectrade.io/people">People</a>
          </div>
          <div class="vt-footer-col">
            <h4>Developers</h4>
            <a href="https://docs.vectrade.io">API Docs</a>
            <a href="https://github.com/VecTrade-io">GitHub</a>
            <a href="https://status.vectrade.io">Status</a>
          </div>
        </div>
        <div class="vt-footer-bottom">
          <p>&copy; 2026 VecTrade. All rights reserved.</p>
          <div class="vt-footer-bottom-links">
            <a href="https://vectrade.io/privacy-policy">Privacy Policy</a>
            <a href="https://vectrade.io/terms-of-service">Terms of Service</a>
            <a href="https://vectrade.io/cookie-policy">Cookie Policy</a>
          </div>
        </div>
      </div>
    </footer>
  css: |
    :root {
      --body-background-color: #0d1117;
      --body-text-color: #e6edf3;
      --card-background-color: #161b22;
      --card-border-color: #30363d;
      --nav-background-color: #161b22;
      --nav-border-bottom-color: #30363d;
      --link-color: #58a6ff;
      --tag-background-color: #1f6feb33;
      --tag-text-color: #58a6ff;
      --success-color: #3fb950;
      --danger-color: #f85149;
      --warning-color: #d29922;
    }
    .content {
      max-width: 900px;
      margin: 0 auto;
    }
    /* Prominent status badges */
    .tag.is-success {
      background-color: #238636 !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.35em 0.75em;
      border-radius: 20px;
    }
    .tag.is-danger {
      background-color: #da3633 !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.35em 0.75em;
      border-radius: 20px;
    }
    .tag.is-warning {
      background-color: #9e6a03 !important;
      color: #fff !important;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.35em 0.75em;
      border-radius: 20px;
    }
    /* Card-like site entries */
    .site-status {
      border: 1px solid var(--card-border-color);
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 0.75rem;
      background: var(--card-background-color);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .site-status:hover {
      border-color: #58a6ff;
      box-shadow: 0 4px 12px rgba(88, 166, 255, 0.08);
    }
    /* All systems operational banner */
    .all-ok, .notification.is-success {
      background: linear-gradient(135deg, #238636 0%, #2ea043 100%) !important;
      border-radius: 12px !important;
      padding: 1.5rem !important;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
      color: #fff !important;
      border: none !important;
      margin-bottom: 2rem;
    }
    /* Hide default Upptime footer */
    footer:not(.vt-footer) {
      display: none !important;
    }

workflowSchedule:
  uptime: "*/5 * * * *"
  graphs: "0 */6 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"

commitMessages:
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms)"
  commitPrefixStatus: "U+1F504"
  commitPrefixStatusUp: "U+2705"
  commitPrefixStatusDown: "U+274C"

i18n:
  activeIncidents: Active Incidents
  allSystemsOperational: All systems are operational
  pastIncidents: Past Incidents
  wasDown: had downtime
  overallUptime: "Overall uptime: $UPTIME"
  overallUptimeTitle: Overall uptime
  averageResponseTime: "Average response time: $TIMEms"
  averageResponseTimeTitle: Average response
  up: Up
  down: Down
  degraded: Degraded
  liveStatus: Live Status
  locale: en-US
