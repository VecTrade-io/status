owner: VecTrade-io
repo: status

sites:
  - name: VecTrade
    url: https://vectrade.io
  - name: VecTrade UAT
    url: https://uat.vectrade.io
  - name: Documentation
    url: https://docs.vectrade.io
  - name: API
    url: https://api.vectrade.io/v1/health
    expectedStatusCodes:
      - 200
      - 404

status-website:
  cname: status.vectrade.io
  logoUrl: https://docs.vectrade.io/logo/light.svg
  name: VecTrade Status
  theme: light
  nav:
    - title: Home
      url: https://vectrade.io
    - title: Docs
      url: https://docs.vectrade.io
    - title: GitHub
      url: https://github.com/VecTrade-io

workflowSchedule:
  uptime: "*/5 * * * *"
  graphs: "0 */6 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"

commitMessages:
  statusChange: "$EMOJI $SITE_NAME is $STATUS ($RESPONSE_CODE in $RESPONSE_TIME ms)"
  commitPrefixStatus: "🔄"
  commitPrefixStatusUp: "✅"
  commitPrefixStatusDown: "❌"

i18n:
  activeIncidents: Active incidents
  noActiveIncidents: All systems operational
  pastIncidents: Past incidents
  wasDown: had downtime
  overallUptime: Overall uptime
  overallUptimePercentage: "% uptime"
