name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: upptime/summary@v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
